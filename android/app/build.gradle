plugins {
    id 'com.android.application'
}
android {
    namespace 'vn.pvcollege.canchinhshim'
    compileSdk 34
    defaultConfig {
        applicationId 'vn.pvcollege.canchinhshim'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
